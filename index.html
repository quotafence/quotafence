<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Allocate and enforce coding-agent subscription quota by project."
    />
    <title>QuotaFence</title>
    <script>
      try {
        const legacyPreference = localStorage.getItem("aqm-theme");
        const preference =
          localStorage.getItem("quotafence-theme") || legacyPreference || "system";
        if (legacyPreference && !localStorage.getItem("quotafence-theme")) {
          localStorage.setItem("quotafence-theme", legacyPreference);
          localStorage.removeItem("aqm-theme");
        }
        const theme =
          preference === "system"
            ? matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : preference;
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
