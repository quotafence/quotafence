[package]
name = "quotafence"
version = "0.1.0-beta.1"
description = "Local-first quota allocation and enforcement for coding-agent subscriptions."
authors = ["buisonanh"]
edition = "2021"
autobins = false
default-run = "quotafence-app"
license = "Apache-2.0"
repository = "https://github.com/quotafence/quotafence"
homepage = "https://github.com/quotafence/quotafence"

[[bin]]
name = "quotafence-app"
path = "src/main.rs"

[[bin]]
name = "quotafence"
path = "src/bin/quotafence.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "quotafence_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "6"
chrono = "0.4.45"
aes = "0.8"
base64 = "0.22"
cbc = "0.1"
libc = "0.2"
pbkdf2 = "0.12"
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
rusqlite = { version = "0.40", features = ["bundled"] }
sha1 = "0.10"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
uuid = "1"
