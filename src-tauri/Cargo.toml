[package]
name = "agent-quota-manager"
version = "0.1.0"
description = "Local-first quota allocation and enforcement for coding-agent subscriptions."
authors = ["buisonanh"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/buisonanh/agent-quota-manager"
homepage = "https://github.com/buisonanh/agent-quota-manager"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "agent_quota_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
