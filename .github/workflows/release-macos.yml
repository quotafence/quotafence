name: macOS beta release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build universal macOS bundle
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Rust targets
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: npm run check:release-version

      - name: Detect signing mode
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          if test -n "$APPLE_CERTIFICATE"; then
            echo "AQM_DEVELOPER_SIGNING=true" >> "$GITHUB_ENV"
          else
            echo "AQM_DEVELOPER_SIGNING=false" >> "$GITHUB_ENV"
          fi

      - name: Require complete notarization secrets for Developer ID builds
        if: env.AQM_DEVELOPER_SIGNING == 'true'
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY_SECRET: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$APPLE_SIGNING_IDENTITY_SECRET"
          test -n "$KEYCHAIN_PASSWORD"
          test -n "$APPLE_ID"
          test -n "$APPLE_PASSWORD"
          test -n "$APPLE_TEAM_ID"

      - name: Import Developer ID certificate
        if: env.AQM_DEVELOPER_SIGNING == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY_SECRET: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/aqm-signing.keychain-db"
          echo "$APPLE_CERTIFICATE" | /usr/bin/base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY_SECRET" >> "$GITHUB_ENV"
          echo "AQM_SIGNING_MODE=Developer ID signed and notarized" >> "$GITHUB_ENV"

      - name: Configure ad-hoc signing
        if: env.AQM_DEVELOPER_SIGNING == 'false'
        run: |
          echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
          echo "AQM_SIGNING_MODE=Ad-hoc signed; not notarized" >> "$GITHUB_ENV"

      - name: Build universal CLI companion
        run: |
          cargo build --locked --release --manifest-path src-tauri/Cargo.toml --bin aqm --target aarch64-apple-darwin
          cargo build --locked --release --manifest-path src-tauri/Cargo.toml --bin aqm --target x86_64-apple-darwin
          mkdir -p src-tauri/target/universal-apple-darwin/release
          lipo -create \
            src-tauri/target/aarch64-apple-darwin/release/aqm \
            src-tauri/target/x86_64-apple-darwin/release/aqm \
            -output src-tauri/target/universal-apple-darwin/release/aqm

      - name: Build ad-hoc universal app and DMG
        if: env.AQM_DEVELOPER_SIGNING == 'false'
        run: npm run tauri -- build --target universal-apple-darwin --bundles app,dmg

      - name: Build Developer ID universal app and DMG
        if: env.AQM_DEVELOPER_SIGNING == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run tauri -- build --target universal-apple-darwin --bundles app,dmg

      - name: Create release metadata and checksums
        run: |
          mkdir -p release-assets
          find src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -exec cp {} release-assets/ \;
          test -n "$(find release-assets -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          cd release-assets
          shasum -a 256 ./*.dmg > SHA256SUMS.txt
          printf 'Signing: %s\nCommit: %s\nWorkflow: %s\n' "$AQM_SIGNING_MODE" "$GITHUB_SHA" "$GITHUB_RUN_ID" > BUILD-INFO.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: agent-quota-manager-macos-universal
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

      - name: Create draft prerelease
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --verify-tag \
            --draft \
            --prerelease \
            --generate-notes \
            --title "Agent Quota Manager $GITHUB_REF_NAME"
