name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Frontend and Rust checks
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Build frontend
        run: npm run build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Check Rust
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Lint Rust
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Smoke-test Unix CLI installer
        run: |
          cargo build --locked --manifest-path src-tauri/Cargo.toml --bin quotafence
          QFENCE_INSTALL_DIR="$RUNNER_TEMP/qfence-bin" scripts/install-cli.sh src-tauri/target/debug/quotafence
          "$RUNNER_TEMP/qfence-bin/qfence" help | grep QuotaFence
          "$RUNNER_TEMP/qfence-bin/quotafence" help | grep QuotaFence
          QFENCE_INSTALL_DIR="$RUNNER_TEMP/qfence-bin" scripts/uninstall-cli.sh
          test ! -e "$RUNNER_TEMP/qfence-bin/qfence"
          test ! -e "$RUNNER_TEMP/qfence-bin/quotafence"
