name: Workspace attribution problem
description: Report usage assigned to the wrong folder or left unassigned unexpectedly.
title: "[Attribution]: "
labels: ["bug", "attribution"]
body:
  - type: markdown
    attributes:
      value: |
        Aggregate percentage changes can remain unassigned during concurrent or ambiguous activity. Do not share prompts, transcripts, source code, or database files.
  - type: input
    id: aqm_version
    attributes:
      label: AQM version
      placeholder: 0.1.0-beta.1
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: macOS version, Mac architecture, and Codex version.
    validations:
      required: true
  - type: dropdown
    id: workflow
    attributes:
      label: Workflow
      options:
        - Codex Desktop with verified hooks
        - Codex Desktop passive tracking
        - aqm run codex
        - Mixed or concurrent workflows
    validations:
      required: true
  - type: textarea
    id: mapping
    attributes:
      label: Redacted workspace mapping
      description: Describe allocated folders, priorities, and expected workspace without private path components.
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: Expected and actual attribution
      description: Include provider percentage before/after, workspace percentage before/after, and whether other Codex tasks were active.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed credentials, prompts, transcripts, source code, database files, and private path details.
          required: true
