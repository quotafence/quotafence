name: Incorrect prompt block
description: Report an allocated Codex or Claude workspace being blocked unexpectedly.
title: "[False block]: "
labels: ["bug", "enforcement"]
body:
  - type: markdown
    attributes:
      value: |
        If work is urgent, disable the provider's workspace protection in QuotaFence Settings while investigating. Do not share prompt text, credentials, transcripts, source code, or database files.
  - type: input
    id: quotafence_version
    attributes:
      label: QuotaFence version
      placeholder: 0.1.0-beta.1
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS version/architecture plus Codex or Claude client and version.
    validations:
      required: true
  - type: textarea
    id: block_message
    attributes:
      label: Exact block message with private paths redacted
    validations:
      required: true
  - type: textarea
    id: state
    attributes:
      label: Allocation and window state
      description: Include allocation target/remaining, priority, total quota remaining, reset time, and protection health.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include whether the provider client was restarted and whether this was a new or existing task.
    validations:
      required: true
  - type: checkboxes
    id: reset
    attributes:
      label: Recovery checks
      options:
        - label: I synced QuotaFence after the latest provider reset.
        - label: I fully quit and reopened the provider client after changing hooks.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed credentials, prompts, transcripts, source code, database files, and private path details.
          required: true
