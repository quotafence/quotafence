name: Installation or upgrade problem
description: Report installer, first-launch, PATH, upgrade, or uninstall failures.
title: "[install]: "
labels: ["bug", "installation"]
body:
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - macOS Apple Silicon
        - macOS Intel
        - Windows 11 x64
        - Windows 10 x64
        - Other unsupported platform
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: QuotaFence version
      placeholder: 0.1.0-beta.1
    validations:
      required: true
  - type: input
    id: artifact
    attributes:
      label: Artifact or installer name
      placeholder: QuotaFence_0.1.0-beta.1_x64-setup.exe
    validations:
      required: true
  - type: dropdown
    id: checksum
    attributes:
      label: Checksum verification
      options:
        - Passed
        - Failed
        - SHA256SUMS.txt was missing
        - Not attempted
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Failing stage
      options:
        - Download or extraction
        - Checksum verification
        - Desktop installation
        - First launch or OS security warning
        - CLI installation or PATH
        - Upgrade
        - Uninstall
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include the exact command and error. Redact usernames and local paths when possible.
    validations:
      required: true
  - type: textarea
    id: build-info
    attributes:
      label: BUILD-INFO.txt
      description: Paste this small provenance file. Do not attach credentials or databases.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, prompts, transcripts, source code, databases, and sensitive paths.
          required: true
